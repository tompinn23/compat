modLoader="javafml"
loaderVersion="[36,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
description="${mod_description}"

# The reason Compat Core registers a mod at all: this is what turns a missing or outdated library
# into a Forge error screen instead of a NoClassDefFoundError at world load.
[[dependencies.${mod_id}]]
    modId="${compat_mod_id}"
    mandatory=true
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[36.2,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.16.5,1.17)"
    ordering="NONE"
    side="BOTH"
