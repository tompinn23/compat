org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
# RFG and Loom on legacy Forge are not configuration-cache safe.
org.gradle.configuration-cache=false
org.gradle.caching=false

mod_id=compatcore
mod_name=Compat Core
mod_group=org.yonside.compat
mod_version=0.1.0
mod_description=Cross-version MetaTileEntity framework
# Shown in the mod list, the POM and mods.toml. ARR blocks modpack redistribution --
# pick a permissive license before other mods depend on this.
mod_license=All Rights Reserved

# Mixin libraries, mappings and the Forge build for each Minecraft version are the compat plugin's
# defaults (gradle-plugin/.../MinecraftTarget.java).
