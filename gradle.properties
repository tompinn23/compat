org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
# RFG and Loom on legacy Forge are not configuration-cache safe.
org.gradle.configuration-cache=false
org.gradle.caching=false

mod_id=compatcore
mod_name=Compat Core
mod_group=org.yonside.compat
mod_version=0.1.0
mod_description=Cross-version MetaTileEntity framework
# Shown in the mod list, the POM and mods.toml. ARR blocks modpack redistribution --
# pick a permissive license before other mods depend on this.
mod_license=All Rights Reserved

# The example mod under example/. Not published; it exists so the framework has a real consumer and
# so `runClient` on each version boots Compat Core the way a player's install would.
# example_mod_id is also hard-coded in each ExampleMod's @Mod annotation, which needs a constant.
example_mod_id=compatexample
example_mod_name=Compat Example
example_mod_description=Example mod built on Compat Core

# Package JvmDowngrader relocates its Java 9+ API stubs to. Must be unique to this mod.
jvmdg_shade_path=org/yonside/compat/jvmdg/

# 1.7.10
unimixins_version=0.3.1

# 1.12.2
mapping_channel_1122=stable
mapping_version_1122=39
mixinbooter_version=11.18

# 1.16.5
forge_1165=1.16.5-36.2.39
