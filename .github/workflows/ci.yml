name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: Gradle plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 25 runs Gradle (RetroFuturaGradle is compiled for it); 21 is the test builds' toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Let Gradle use the installed JDKs as toolchains
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p gradle-plugin check --stacktrace
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-reports
          path: gradle-plugin/build/reports/

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDKs 8 (Azul, for RFG), 25 (Gradle daemon) and 21 (sources)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Let Gradle use the installed JDKs as toolchains
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build dist --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/dist/*.jar
            example/*/build/libs/compatexample-*.jar
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: "**/build/reports/"

  smoke:
    name: Server smoke test (${{ matrix.module }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [mc1710, mc1122, mc1165]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDKs 8 (Azul, for RFG), 25 (Gradle daemon) and 21 (sources)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Let Gradle use the installed JDKs as toolchains
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/ci/server-smoke.sh ${{ matrix.module }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.module }}
          path: |
            build/smoke-${{ matrix.module }}.log
            ${{ matrix.module }}/run/logs/
            ${{ matrix.module }}/run/crash-reports/
            ${{ matrix.module }}/run/**/logs/
            ${{ matrix.module }}/run/**/crash-reports/

  publish:
    name: Publish to maven.yonside.org
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDKs 8 (Azul, for RFG), 25 (Gradle daemon) and 21 (sources)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - name: Let Gradle use the installed JDKs as toolchains
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew publishAll --stacktrace && ./gradlew -p gradle-plugin publish --stacktrace
        env:
          YONSIDE_USERNAME: ${{ secrets.YONSIDE_USERNAME }}
          YONSIDE_PASSWORD: ${{ secrets.YONSIDE_PASSWORD }}
